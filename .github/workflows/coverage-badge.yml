name: Coverage Badge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  badge:
    name: Generate coverage badge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests with coverage
        run: |
          go test -coverprofile=combined.out ./... 2>/dev/null || true

      - name: Generate badge URL
        id: badge
        run: |
          COVERAGE=$(go tool cover -func=combined.out | grep 'total:' | awk '{print $3}' | tr -d '%')
          if [ -z "$COVERAGE" ]; then
            COVERAGE="0.0"
          fi
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Update README badge
        run: |
          COVERAGE="${{ steps.badge.outputs.coverage }}"
          ESCAPED=$(echo "$COVERAGE%" | sed 's/%/%25/g')
          # Update the shields.io badge link in README.md
          sed -i "s|https://img.shields.io/badge/coverage-[0-9.]*%25-brightgreen|https://img.shields.io/badge/coverage-${ESCAPED}-brightgreen|" README.md

      - name: Commit and push badge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || exit 0
          git commit -m "chore: update coverage badge to ${{ steps.badge.outputs.coverage }}%"
          git push origin main
