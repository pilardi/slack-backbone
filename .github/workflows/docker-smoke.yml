name: Docker Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Docker smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: slack-backbone:test

      - name: Run smoke test (help)
        run: |
          docker run --rm slack-backbone:test --help 2>&1 | grep -q "Usage:" || exit 1

      - name: Run smoke test (no-args)
        run: |
          timeout 5 docker run --rm slack-backbone:test 2>&1 | grep -qi "starting\|listening\|error" || true
