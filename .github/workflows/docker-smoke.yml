name: Docker Smoke Test

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  smoke:
    name: Docker smoke test
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - name: Download Docker image artifact from CI
        uses: actions/download-artifact@v5
        with:
          name: slack-backbone-image-${{ github.sha }}
          path: /tmp/image
          repository: ${{ github.event.workflow_run.repository.full_name }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load Docker image
        run: |
          docker load -i /tmp/image/docker-image.tar
          echo "Image loaded successfully"

      - name: Verify image tag
        run: |
          docker images slack-backbone:${{ github.sha }} | grep slack-backbone || exit 1
          echo "Image verified: slack-backbone:${{ github.sha }}"

      - name: Smoke test (--help)
        run: |
          timeout 5s docker run --rm slack-backbone:${{ github.sha }} --help | grep -q "Usage:"

      - name: Smoke test (log-level flag)
        run: |
          timeout 5s docker run --rm slack-backbone:${{ github.sha }} --log-level debug || true

      - name: Smoke test (cli mode with HTTP port)
        run: |
          timeout 10s docker run --rm \
            -e MODE=cli \
            -e HTTP_PORT=8080 \
            slack-backbone:${{ github.sha }} || true

      - name: Smoke test (mcp mode, stdio transport)
        run: |
          timeout 10s docker run --rm \
            -e MODE=mcp \
            slack-backbone:${{ github.sha }} || true

      - name: Integration-style test (config validation via exit code)
        run: |
          # Test that the binary exits cleanly with valid config
          docker run --rm slack-backbone:${{ github.sha }} --help > /dev/null 2>&1
          echo "Config validation passed"

      - name: Integration-style test (multi-flag combination)
        run: |
          timeout 5s docker run --rm \
            -e MODE=cli \
            -e HTTP_PORT=9090 \
            -e SLACK_BACKBONE_LOG_LEVEL=debug \
            slack-backbone:${{ github.sha }} || true
