name: Docker Smoke Test

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  smoke:
    name: Docker smoke test
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - name: Download Docker image artifact from CI
        uses: actions/download-artifact@v5
        with:
          name: slack-backbone-image-${{ github.sha }}
          path: /tmp/image
          repository: ${{ github.event.workflow_run.repository.full_name }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load Docker image
        run: |
          ls -la /tmp/image/ || { echo "ERROR: artifact directory empty"; exit 1; }
          docker load -i /tmp/image/docker-image.tar || { echo "ERROR: docker load failed"; exit 1; }
          echo "Image loaded successfully"

      - name: Verify image tag exists locally
        run: |
          IMAGE="slack-backbone:${{ github.sha }}"
          if ! docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}}' | grep -q "$IMAGE"; then
            echo "ERROR: Image $IMAGE not found after load!"
            docker images -a
            exit 1
          fi
          echo "Image verified locally: $IMAGE"

      - name: Smoke test (--help, no config needed)
        run: |
          timeout 5s docker run --rm slack-backbone:${{ github.sha }} --help | grep -q "Usage:"

      - name: Smoke test (log-level flag with inline config)
        run: |
          # Use --config /dev/null since we don't have teams.yaml in the container
          timeout 5s docker run --rm \
            slack-backbone:${{ github.sha }} \
            --config /dev/null \
            --log-level debug || true

      - name: Smoke test (cli mode with HTTP port)
        run: |
          # cli mode needs teams.yaml; use inline minimal config via --config
          timeout 10s docker run --rm \
            slack-backbone:${{ github.sha }} \
            --config /dev/null \
            -e MODE=cli \
            -e HTTP_PORT=8080 || true

      - name: Smoke test (mcp mode, stdio transport)
        run: |
          timeout 10s docker run --rm \
            slack-backbone:${{ github.sha }} \
            --config /dev/null \
            -e MODE=mcp \
            || true

      - name: Integration-style test (multi-flag combination)
        run: |
          timeout 5s docker run --rm \
            slack-backbone:${{ github.sha }} \
            --config /dev/null \
            -e MODE=cli \
            -e HTTP_PORT=9090 \
            -e SLACK_BACKBONE_LOG_LEVEL=debug \
            || true
