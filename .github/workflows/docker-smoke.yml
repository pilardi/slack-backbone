name: Docker Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Docker smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: slack-backbone:test

      - name: Run smoke test (help)
        run: |
          OUTPUT=$(docker run --rm slack-backbone:test --help 2>&1) || exit 1
          echo "$OUTPUT" | grep -q "Usage:" || { echo "FAIL: no Usage line found"; exit 1; }

      - name: Run smoke test (no-args with env)
        run: |
          OUTPUT=$(timeout 5 docker run --rm -e MODE=cli -e HTTP_PORT=0 slack-backbone:test 2>&1) || true
          echo "$OUTPUT" | grep -qi "starting\|listening\|error" || echo "no match (expected for cli mode)"
